name: Factory - Core Runtime Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'images/core-runtime/**'
      - '.github/workflows/build-core-runtime.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'images/core-runtime/**'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  build-and-audit:
    name: Build & Audit Core Runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Containerfile (Hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: images/core-runtime/Containerfile

      - name: Build OCI Image (Buildah)
        id: build-image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: hardened-core-runtime
          tags: ${{ github.sha }}
          context: ./images/core-runtime
          containerfiles: ./images/core-runtime/Containerfile
          oci: true

      - name: Export Image for Trivy
        env:
          IMAGE: ${{ steps.build-image.outputs.image-with-tag }}
        run: buildah push "$IMAGE" "docker-archive:$RUNNER_TEMP/image.tar"

      - name: Vulnerability Audit with Trivy (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: '${{ runner.temp }}/image.tar'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  publish-image:
    name: Publish Production Image
    needs: build-and-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # Krävs för SLSA-intyg via GitHub
      attestations: write  # Krävs för att skriva attesteringar
    steps:
      - name: Checkout Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Hanterar automatiskt gemener, latest-tagg och short SHA
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/core-runtime
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Bygger och pushar i ett enda steg samt exporterar ren digest
      - name: Build and Push Image
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./images/core-runtime
          file: ./images/core-runtime/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Genererar och publicerar SLSA Provenance direkt i GHCR
      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/core-runtime
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
