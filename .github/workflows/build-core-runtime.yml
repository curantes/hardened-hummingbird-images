name: Factory - Core Runtime Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'images/core-runtime/**'
      - '.github/workflows/build-core-runtime.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'images/core-runtime/**'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  build-and-audit:
    name: Build & Audit Core Runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lint Containerfile (Hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: images/core-runtime/Containerfile

      - name: Build OCI Image (Buildah)
        id: build-image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2.13
        with:
          image: hardened-core-runtime
          tags: ${{ github.sha }}
          context: ./images/core-runtime
          containerfiles: ./images/core-runtime/Containerfile
          oci: true

      - name: Vulnerability Audit with Trivy (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'hardened-core-runtime:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  publish-sign-attest:
    name: Publish, Sign & Attest Core Runtime
    needs: build-and-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      image-digest: ${{ steps.push.outputs.registry-digest }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Build Production Image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2.13
        with:
          image: ${{ github.repository_owner }}/hardened-hummingbird-images
          tags: core-runtime core-runtime-${{ github.sha }}
          context: ./images/core-runtime
          containerfiles: ./images/core-runtime/Containerfile
          oci: true

      - name: Push to GHCR
        id: push
        uses: redhat-actions/push-to-registry@5101662c64e528148cf496735e5d1607ef3fca7c # v2.8.0
        with:
          image: ${{ github.repository_owner }}/hardened-hummingbird-images
          tags: core-runtime core-runtime-${{ github.sha }}
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SPDX SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/\({{ github.repository_owner }}/hardened-hummingbird-images:core-runtime-\){{ github.sha }}
          format: spdx-json
          output-file: sbom-core-runtime.spdx.json

      - name: Cosign OIDC Keyless Sign & Attach Attestation
        run: |
          IMAGE_REF="ghcr.io/\({{ github.repository_owner }}/hardened-hummingbird-images:core-runtime-\){{ github.sha }}"
          DIGEST="${{ steps.push.outputs.registry-digest }}"
          cosign sign --yes "\({IMAGE_REF}@\){DIGEST}"
          cosign attest --yes --predicate sbom-core-runtime.spdx.json --type spdx "\({IMAGE_REF}@\){DIGEST}"

      - name: Generate SLSA Provenance Attestation (Native)
        uses: actions/attest-docker-build@v1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/hardened-hummingbird-images
          subject-digest: ${{ steps.push.outputs.registry-digest }}
          push-to-registry: true
