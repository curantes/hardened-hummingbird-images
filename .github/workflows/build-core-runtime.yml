name: Factory - Core Runtime Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'images/core-runtime/**'
      - '.github/workflows/build-core-runtime.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'images/core-runtime/**'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  build-and-audit:
    name: Build & Audit Core Runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Containerfile (Hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: images/core-runtime/Containerfile

      - name: Build OCI Image (Buildah)
        id: build-image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: hardened-core-runtime
          tags: ${{ github.sha }}
          context: ./images/core-runtime
          containerfiles: ./images/core-runtime/Containerfile
          oci: true

      - name: Export Image for Trivy
        env:
          IMAGE: ${{ steps.build-image.outputs.image-with-tag }}
        run: buildah push "$IMAGE" "docker-archive:$RUNNER_TEMP/image.tar"

      - name: Vulnerability Audit with Trivy (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: '${{ runner.temp }}/image.tar'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  publish-image:
    name: Publish Production Image
    needs: build-and-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.push.outputs.registry-digest }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Short Git SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Production Image (Buildah)
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: ${{ github.repository_owner }}/hardened-core-runtime
          tags: |
            latest
            ${{ steps.vars.outputs.short_sha }}
          context: ./images/core-runtime
          containerfiles: ./images/core-runtime/Containerfile
          oci: true

      - name: Push to GHCR
        id: push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ github.repository_owner }}/core-runtime
          tags: |
            latest
            ${{ steps.vars.outputs.short_sha }}
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  slsa-provenance:
    name: Generate SLSA 3 Provenance
    needs: publish-image
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ghcr.io/${{ github.repository_owner }}/core-runtime
      digest: ${{ needs.publish-image.outputs.image-digest }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
