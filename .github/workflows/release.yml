name: Governance - Publish Release & Attach SBOMs

on:
  push:
    branches: [ "main" ]
    paths:
      - 'images/**'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate CalVer Release Tag
        id: tag
        run: |
          DATE_TAG=$(date +'%Y.%m.%d')
          echo "tag_name=v${DATE_TAG}-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Release ${{ steps.tag.outputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
