name: Governance - Publish Release & Attach SBOMs

on:
  push:
    branches: [ "main" ]
    paths:
      - 'images/**'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate Release Tag
        id: tag
        run: echo "tag_name=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Draft Release Notes & Tag Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb8723d3062ed07a21f66d4 # v2.2.1
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Release ${{ steps.tag.outputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
