name: Factory - Static Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'images/static/**'
      - '.github/workflows/build-static.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'images/static/**'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  build-and-audit:
    name: Build & Audit Static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Containerfile (Hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: images/static/Containerfile

      - name: Build OCI Image (Buildah)
        id: build-image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: hardened-static
          tags: ${{ github.sha }}
          context: ./images/static
          containerfiles: ./images/static/Containerfile
          oci: true

      - name: Export Image for Trivy
        env:
          IMAGE: ${{ steps.build-image.outputs.image-with-tag }}
        run: buildah push "$IMAGE" "docker-archive:$RUNNER_TEMP/image.tar"

      - name: Vulnerability Audit with Trivy (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: '${{ runner.temp }}/image.tar'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  publish-image:
    name: Publish Production Image
    needs: build-and-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
      image-name: ${{ steps.meta.outputs.bake-target }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/static
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: ./images/static
          file: ./images/static/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  slsa-provenance:
    name: Generate SLSA 3 Provenance
    needs: publish-image
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ghcr.io/${{ needs.publish-image.outputs.image-name }}/static
      digest: ${{ needs.publish-image.outputs.image-digest }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
