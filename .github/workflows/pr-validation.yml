name: Factory - PR Validation

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'images/**'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  matrix-build-and-audit:
    name: Build & Audit (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: static
            path: images/static
            context: ./images/static
          - name: core-runtime
            path: images/core-runtime
            context: ./images/core-runtime

    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint Containerfile (Hadolint)
        uses: hadolint/hadolint-action@54c226d9c62391e84d5f479dce9e89791823f663 # v3.1.0
        with:
          dockerfile: ${{ matrix.image.path }}/Containerfile

      - name: Build OCI Image (Buildah)
        id: build-image
        uses: redhat-actions/buildah-build@b4dc372f53d4ebc3b6a7d8a6df201e52382046e7 # v2.8.0
        with:
          image: hardened-${{ matrix.image.name }}
          tags: pr-${{ github.event.pull_request.number }}
          context: ${{ matrix.image.context }}
          containerfiles: ${{ matrix.image.path }}/Containerfile
          oci: true

      - name: Vulnerability Audit with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402250b237b462a86219b4 # v0.29.0
        with:
          image-ref: 'hardened-${{ matrix.image.name }}:pr-${{ github.event.pull_request.number }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
